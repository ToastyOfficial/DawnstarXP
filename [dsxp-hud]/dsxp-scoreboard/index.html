<html>
	<head>
		<script src="nui://game/ui/jquery.js" type="text/javascript"></script>
		<link href='http://fonts.googleapis.com/css?family=Open+Sans:400,300,600,700,800' rel='stylesheet' type='text/css'>
	</head>
	<body>
		<div id="scoreboard" style="background-color:#181c21; width:500px; min-height:185px;margin-top:5%; margin-left:auto; margin-right:auto; border-radius: 20px; align-content:center; text-align:center">
			<h2 style="color: white; text-align:center; font-family:Open Sans; font-weight:800">SERVER NAME HERE</h2>
			<table class="table" style="width: 80%; margin-left:10%; margin-right:10%;border-collapse: collapse;table-layout:fixed">
				<thead style="border-bottom: 1px solid purple">
					<tr>
						<th style="color:white; font-family:'Open Sans'; font-weight:300; width:75%; text-align:left">Player Name:</th>
						<th style="color:white; font-family:'Open Sans'; font-weight:300; width:10%; text-align:right">ID:</th>
					</tr>
				</thead>
				<tbody id="{div}" style="overflow:auto"></tbody>
			</table>
			<br/><br/>
			<p style="font-family:'Open Sans'; font-weight:100; color:white" id="connectedPlayers">Players: 0/64</p>
		</div>


		<script>
			$(function () {
				$("#scoreboard").css('display', "none");
				window.addEventListener('message', function (event) {
					if (event.data.type == "SCOREBOARD_ADD_PLAYER") {
						if (event.data.myid == event.data.id) {
							$("#scoreboard").find('tbody').append( "<tr><td style='color:purple; font-family:Open Sans; font-weight:800'>"+event.data.name+"</td><td style='color:purple; font-family:Open Sans; font-weight:800; text-align='right' align=right>"+event.data.id+"</td></tr>" );
						}
						else {
							$("#scoreboard").find('tbody').append( "<tr><td style='color:white; font-family:Open Sans; font-weight:400'>"+event.data.name+"</td><td style='color:white; font-family:Open Sans; font-weight:400; text-align='right' align=right>"+event.data.id+"</td></tr>" );
						}
						$("#connectedPlayers").text("Players: "+event.data.total+"/32");
						$("#scoreboard").css('display', "block");


					}
					else if (event.data.type == "SCOREBOARD_CLOSE") {
						$('#scoreboard').find('tbody').empty();
						$("#scoreboard").css('display', "none");
					}
				});
			});
		</script>
	</body>
</html>
